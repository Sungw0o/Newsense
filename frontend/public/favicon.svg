<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="mark" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9CCBFF"/>
      <stop offset="55%" stop-color="#0084ff"/>
      <stop offset="100%" stop-color="#0a4a99"/>
    </radialGradient>
    <filter id="inner-light">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded square base -->
  <rect width="48" height="48" rx="11" fill="url(#mark)"/>
  <!-- Inner highlight -->
  <rect width="48" height="48" rx="11" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <!-- "N" lettermark — bold white -->
  <path d="M11 34 L11 14 L25 34 L25 14" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M30 14 L37 14 L37 34" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M30 34 L30 14" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
