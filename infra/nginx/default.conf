map $http_x_forwarded_proto $newsense_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_host $newsense_forwarded_host {
    default $http_x_forwarded_host;
    "" $host;
}

map $http_x_forwarded_port $newsense_forwarded_port {
    default $http_x_forwarded_port;
    "" $server_port;
}

upstream newsense_backend {
    server app:8080;
}

server {
    listen 80;
    server_name api.new5ense.site _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://newsense_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $newsense_forwarded_proto;
        proxy_set_header X-Forwarded-Host $newsense_forwarded_host;
        proxy_set_header X-Forwarded-Port $newsense_forwarded_port;
        proxy_set_header Connection "";
    }

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
