name: newsense

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: newsense-backend:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-newsense}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-newsense}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-validate}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE:-newsense}?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-1800000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-1209600000}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://new5ense.site}
      APP_BACKEND_URL: ${APP_BACKEND_URL:-https://api.new5ense.site}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NAVER_OAUTH_CLIENT_ID: ${NAVER_OAUTH_CLIENT_ID:-}
      NAVER_OAUTH_CLIENT_SECRET: ${NAVER_OAUTH_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      GMS_KEY: ${GMS_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      GMS_MODEL: ${GMS_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_PIPELINE_MAX_QUIZ_RETRIES: ${AI_PIPELINE_MAX_QUIZ_RETRIES:-2}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-large}
      AI_FACT_EXTRACTOR_MODEL: ${AI_FACT_EXTRACTOR_MODEL:-gemini-2.5-flash-lite}
      AI_ARTICLE_CLASSIFIER_MODEL: ${AI_ARTICLE_CLASSIFIER_MODEL:-gpt-4o-mini}
      AI_QUIZ_GENERATOR_MODEL: ${AI_QUIZ_GENERATOR_MODEL:-o3-mini}
      AI_QUIZ_CRITIC_MODEL: ${AI_QUIZ_CRITIC_MODEL:-gpt-4o-mini}
      CRAWLER_ENABLED: ${CRAWLER_ENABLED:-true}
      CRAWLER_BOOTSTRAP_ENABLED: ${CRAWLER_BOOTSTRAP_ENABLED:-false}
      CRAWLER_MINIMUM_ARTICLES: ${CRAWLER_MINIMUM_ARTICLES:-30}
      CRAWLER_MAX_ITEMS: ${CRAWLER_MAX_ITEMS:-30}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      TOSS_INVEST_ENABLED: ${TOSS_INVEST_ENABLED:-false}
      TOSS_INVEST_BASE_URL: ${TOSS_INVEST_BASE_URL:-https://open-api.tossinvest.com}
      TOSS_INVEST_API_KEY: ${TOSS_INVEST_API_KEY:-}
      TOSS_INVEST_SECRET_KEY: ${TOSS_INVEST_SECRET_KEY:-}
      BOK_CRAWLER_LIST_URL: ${BOK_CRAWLER_LIST_URL}
      MOEF_CRAWLER_LIST_URL: ${MOEF_CRAWLER_LIST_URL}
      RAG_VECTOR_SEARCH_ENABLED: ${RAG_VECTOR_SEARCH_ENABLED:-true}
      RAG_VECTOR_SEARCH_MODE: ${RAG_VECTOR_SEARCH_MODE:-local}
      RAG_VECTOR_SEARCH_INDEX_NAME: ${RAG_VECTOR_SEARCH_INDEX_NAME:-article_embedding_index}
      RAG_VECTOR_SEARCH_NUM_CANDIDATES: ${RAG_VECTOR_SEARCH_NUM_CANDIDATES:-200}
      RAG_VECTOR_SEARCH_DIMENSIONS: ${RAG_VECTOR_SEARCH_DIMENSIONS:-3072}
      RAG_VECTOR_WEIGHT: ${RAG_VECTOR_WEIGHT:-0.45}
      RAG_KEYWORD_WEIGHT: ${RAG_KEYWORD_WEIGHT:-0.20}
      RAG_RECENCY_WEIGHT: ${RAG_RECENCY_WEIGHT:-0.10}
      RAG_CATEGORY_WEIGHT: ${RAG_CATEGORY_WEIGHT:-0.10}
      RAG_WEAKNESS_WEIGHT: ${RAG_WEAKNESS_WEIGHT:-0.10}
      RAG_MARKET_WEIGHT: ${RAG_MARKET_WEIGHT:-0.05}
      RAG_EMBEDDING_BACKFILL_ENABLED: ${RAG_EMBEDDING_BACKFILL_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - newsense_internal

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-newsense}
      MYSQL_USER: ${MYSQL_USER:-newsense}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - newsense_internal

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-newsense}
      TZ: Asia/Seoul
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - newsense_internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - newsense_internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - newsense_internal

networks:
  newsense_internal:
    driver: bridge
    internal: false

volumes:
  mysql_data:
  mongo_data:
  redis_data:
