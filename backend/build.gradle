plugins {
    id 'java'
    id 'jacoco'
    id 'org.sonarqube' version '6.2.0.5505'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.newsense'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.jsoup:jsoup:1.22.2'
    implementation 'org.apache.pdfbox:pdfbox:3.0.1'
    implementation 'net.sourceforge.tess4j:tess4j:5.8.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testImplementation 'org.testcontainers:mongodb:1.19.7'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

def jacocoExcludes = [
        '**/*Application*',
        '**/*Config*',
        '**/*Properties*',
        '**/*ApiDocs*',
        '**/*Request*',
        '**/*Response*',
        '**/*Event*',
        '**/*Repository*',
        '**/*Document*',
        '**/*Domain*',
        '**/controller/**',
        '**/auth/security/**',
        '**/auth/token/**',
        '**/common/**',
        '**/domain/**',
        '**/dto/**',
        '**/document/**',
        '**/repository/**',
        '**/config/**',
        '**/event/**',
        '**/package-info.class',
        '**/ai/**',
        '**/crawler/client/**',
        '**/crawler/config/**',
        '**/crawler/model/**',
        '**/crawler/scheduler/**',
        '**/crawler/service/**',
        '**/crawler/service/LocalArticleBootstrapRunner*'
]

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: jacocoExcludes)
    }))
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(files(tasks.named('jacocoTestReport').get().classDirectories))
    sourceDirectories.setFrom(files(sourceSets.main.allSource.srcDirs))
    executionData.setFrom(fileTree(layout.buildDirectory).include('jacoco/test.exec'))
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

sonar {
    properties {
        property 'sonar.projectKey', System.getenv('SONAR_PROJECT_KEY') ?: 'newsense-backend'
        property 'sonar.projectName', System.getenv('SONAR_PROJECT_NAME') ?: 'newsense-backend'
        if (System.getenv('SONAR_ORGANIZATION')) {
            property 'sonar.organization', System.getenv('SONAR_ORGANIZATION')
        }
        if (System.getenv('SONAR_HOST_URL')) {
            property 'sonar.host.url', System.getenv('SONAR_HOST_URL')
        }
        if (System.getenv('SONAR_TOKEN')) {
            property 'sonar.token', System.getenv('SONAR_TOKEN')
        }
        property 'sonar.coverage.jacoco.xmlReportPaths', layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile
        property 'sonar.qualitygate.wait', 'true'
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
