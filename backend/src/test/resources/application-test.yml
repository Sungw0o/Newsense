spring:
  datasource:
    url: jdbc:h2:mem:newsense;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/newsense-test
    redis:
      host: localhost
      port: 6379

jwt:
  secret: newsense-test-jwt-secret-key-at-least-32-bytes
  access-expiration: 1800000
  refresh-expiration: 1209600000
  secure-cookie: false

crawler:
  enabled: false
  bootstrap-enabled: false
  minimum-articles: 10
