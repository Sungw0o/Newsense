spring:
  application:
    name: newsense-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:newsense-google-local}
            client-secret: ${GOOGLE_CLIENT_SECRET:newsense-google-local-secret}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_OAUTH_CLIENT_ID:newsense-naver-local}
            client-secret: ${NAVER_OAUTH_CLIENT_SECRET:newsense-naver-local-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
            scope:
              - name
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:newsense-kakao-local}
            client-secret: ${KAKAO_CLIENT_SECRET:newsense-kakao-local-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  frontend-url: ${APP_FRONTEND_URL:http://127.0.0.1:5173}

server:
  port: ${SERVER_PORT:8080}

openai:
  api-key: ${GMS_KEY:${OPENAI_API_KEY:}}
  base-url: ${GMS_BASE_URL:${OPENAI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}}
  model: ${GMS_MODEL:${OPENAI_MODEL:gpt-4o-mini}}

ai:
  pipeline:
    max-quiz-retries: ${AI_PIPELINE_MAX_QUIZ_RETRIES:2}
    models:
      embedding: ${AI_EMBEDDING_MODEL:text-embedding-3-large}
      fact-extractor: ${AI_FACT_EXTRACTOR_MODEL:gemini-2.5-flash-lite}
      article-classifier: ${AI_ARTICLE_CLASSIFIER_MODEL:gpt-4o-mini}
      quiz-generator: ${AI_QUIZ_GENERATOR_MODEL:o3-mini}
      quiz-critic: ${AI_QUIZ_CRITIC_MODEL:gpt-4o-mini}

crawler:
  pdf-min-text-length: ${CRAWLER_PDF_MIN_TEXT_LENGTH:500}
  tess-data-path: ${TESS_DATA_PATH:}
  naver-client-id: ${NAVER_CLIENT_ID:}
  naver-client-secret: ${NAVER_CLIENT_SECRET:}
  news-api-key: ${NEWS_API_KEY:}
  cron:
    public-source: ${SPRING_CRAWLER_CRON_PUBLIC:0 0 11,17 * * MON-FRI}
    portal-source: ${SPRING_CRAWLER_CRON_PORTAL:0 0 8,14,20 * * *}
