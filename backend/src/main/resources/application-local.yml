spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:13306/newsense?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/newsense}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:newsense-local-jwt-secret-key-at-least-32-bytes}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  secure-cookie: false

crawler:
  enabled: ${CRAWLER_ENABLED:false}
  bootstrap-enabled: ${CRAWLER_BOOTSTRAP_ENABLED:true}
  minimum-articles: ${CRAWLER_MINIMUM_ARTICLES:30}
  initial-delay: ${CRAWLER_INITIAL_DELAY:30000}
  fixed-delay: ${CRAWLER_FIXED_DELAY:3600000}
  connection-timeout: ${CRAWLER_CONNECTION_TIMEOUT:10000}
  max-items-per-source: ${CRAWLER_MAX_ITEMS:30}
  max-retries: ${CRAWLER_MAX_RETRIES:3}
  retry-delay: ${CRAWLER_RETRY_DELAY:1000}
  request-delay: ${CRAWLER_REQUEST_DELAY:500}
  chunk-size: ${CRAWLER_CHUNK_SIZE:800}
  pdf-min-text-length: ${CRAWLER_PDF_MIN_TEXT_LENGTH:500}
  tess-data-path: ${TESS_DATA_PATH:}
  naver-client-id: ${NAVER_CLIENT_ID:}
  naver-client-secret: ${NAVER_CLIENT_SECRET:}
  news-api-key: ${NEWS_API_KEY:}
  cron:
    public-source: ${SPRING_CRAWLER_CRON_PUBLIC:0 0 11,17 * * MON-FRI}
    portal-source: ${SPRING_CRAWLER_CRON_PORTAL:0 0 8,14,20 * * *}
  sources:
    - key: bok
      name: 한국은행
      base-url: https://www.bok.or.kr
      list-url: https://www.bok.or.kr/portal/singl/newsData/listCont.do?pageIndex=1&targetDepth=3&menuNo=201263&syncMenuChekKey=1&searchCnd=1&searchKwd=
      item-selector: li.bbsRowCls
      link-selector: a.title
      date-selector: .dataInfo .date
      body-selector: meta[property=description]
      body-attribute: content
      enabled: true
    - key: moef
      name: 기획재정부
      base-url: https://www.moef.go.kr
      list-url: https://www.moef.go.kr/nw/nes/nesdta.do?menuNo=4010100
      item-selector: .board_list tbody tr
      link-selector: a
      date-selector: .date
      body-selector: .view_cont
      body-attribute:
      enabled: true

logging:
  level:
    com.newsense.backend: DEBUG
