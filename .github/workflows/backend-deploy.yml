name: Backend CI / CD

# ─────────────────────────────────────────────────────────────────────────────
# 트리거 규칙
#   · backend/** 변경이 있는 모든 push  → CI (테스트 + SonarQube)
#   · develop / main push               → CI 완료 후 EC2 배포까지 실행
#   · develop / main 으로 향하는 PR     → CI 만 (배포 없음)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # CI — 모든 브랜치에서 실행
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    name: Test & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # SonarQube 이슈 추적에 전체 히스토리 필요

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test & Coverage Gate (Jacoco 80%)
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: SonarQube Analysis
        if: ${{ env.SONAR_TOKEN != '' && vars.SONAR_CI_ENABLED == 'true' }}
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Sungw0o_Newsense' }}
          SONAR_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME || 'Newsense' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'sungw0o' }}
        run: ./gradlew sonar

  # ────────────────────────────────────────────────────────────────────────────
  # CD — develop / main push 시에만 실행
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew

      # EC2 빌드 부하를 차단하기 위해 CI 러너에서 직접 JAR 생성
      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon

      - name: Copy Docker Compose manifests to EC2 via SCP
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,infra/nginx/default.conf,backend/Dockerfile.prod"
          target: "/opt/newsense/"

      # EC2 /opt/newsense/backend/build/libs/ 로 JAR 전송
      # strip_components: 3 → backend/build/libs/{jar} → {jar} → target 디렉터리에 적재
      - name: Copy JAR to EC2 via SCP
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/opt/newsense/backend/build/libs/"
          strip_components: 3

      # Docker Compose로 app 서비스만 리빌드 후 재시작, 이미지 정리
      - name: Restart app via Docker Compose
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/newsense
            mkdir -p backend/build/libs infra/nginx
            test -f .env
            chmod 600 .env
            docker compose build app
            docker compose up -d mysql mongodb redis app nginx
            # EBS 8GB 여유 공간 확보 — 미사용 이미지 즉시 정리
            docker image prune -f
