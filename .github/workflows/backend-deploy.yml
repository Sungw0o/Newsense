name: Backend CI / CD

# ─────────────────────────────────────────────────────────────────────────────
# 트리거 규칙
#   · backend/** 변경이 있는 모든 push  → CI (테스트 + SonarQube)
#   · develop / main push               → CI 완료 후 EC2 배포까지 실행
#   · develop / main 으로 향하는 PR     → CI 만 (배포 없음)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'backend/**'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # CI — 모든 브랜치에서 실행
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    name: Test & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # SonarQube 이슈 추적에 전체 히스토리 필요

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test & Coverage Gate (Jacoco 80%)
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: SonarQube Analysis
        if: ${{ env.SONAR_TOKEN != '' && vars.SONAR_CI_ENABLED == 'true' }}
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'Sungw0o_Newsense' }}
          SONAR_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME || 'Newsense' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'sungw0o' }}
        run: ./gradlew sonar

  # ────────────────────────────────────────────────────────────────────────────
  # CD — develop / main push 시에만 실행
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Ensure Gradle wrapper executable
        run: chmod +x ./gradlew

      # EC2 빌드 부하를 차단하기 위해 CI 러너에서 직접 JAR 생성
      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon

      - name: Copy Docker Compose manifests to EC2 via SCP
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,infra/nginx/default.conf,backend/Dockerfile.prod"
          target: "/opt/newsense/"

      # EC2 /opt/newsense/backend/build/libs/ 로 JAR 전송
      # strip_components: 3 → backend/build/libs/{jar} → {jar} → target 디렉터리에 적재
      - name: Copy JAR to EC2 via SCP
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/build/libs/*.jar"
          target: "/opt/newsense/backend/build/libs/"
          strip_components: 3

      # Docker Compose로 app 서비스만 리빌드 후 재시작, 이미지 정리
      - name: Restart app via Docker Compose
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/newsense
            mkdir -p backend/build/libs infra/nginx
            : > .env
            chmod 600 .env
            cat > .env <<'EOF'
            SPRING_PROFILES_ACTIVE=prod
            SERVER_FORWARD_HEADERS_STRATEGY=framework
            NGINX_BIND_ADDRESS=127.0.0.1
            NGINX_HTTP_PORT=8080

            MYSQL_DATABASE=${{ vars.MYSQL_DATABASE || 'newsense' }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            SPRING_JPA_DDL_AUTO=${{ vars.SPRING_JPA_DDL_AUTO || 'validate' }}

            MONGO_DATABASE=${{ vars.MONGO_DATABASE || 'newsense' }}
            MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_INITDB_ROOT_USERNAME }}
            MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_EXPIRATION=${{ vars.JWT_ACCESS_EXPIRATION || '1800000' }}
            JWT_REFRESH_EXPIRATION=${{ vars.JWT_REFRESH_EXPIRATION || '1209600000' }}

            APP_FRONTEND_URL=${{ vars.APP_FRONTEND_URL || 'https://new5ense.site' }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            NAVER_OAUTH_CLIENT_ID=${{ secrets.NAVER_OAUTH_CLIENT_ID }}
            NAVER_OAUTH_CLIENT_SECRET=${{ secrets.NAVER_OAUTH_CLIENT_SECRET }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}

            GMS_KEY=${{ secrets.GMS_KEY }}
            GMS_BASE_URL=${{ vars.GMS_BASE_URL || 'https://gms.ssafy.io/gmsapi/api.openai.com/v1' }}
            GMS_MODEL=${{ vars.GMS_MODEL || 'gpt-4o-mini' }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || secrets.GMS_KEY }}
            OPENAI_BASE_URL=${{ vars.OPENAI_BASE_URL || vars.GMS_BASE_URL || 'https://gms.ssafy.io/gmsapi/api.openai.com/v1' }}
            OPENAI_MODEL=${{ vars.OPENAI_MODEL || vars.GMS_MODEL || 'gpt-4o-mini' }}
            AI_PIPELINE_MAX_QUIZ_RETRIES=${{ vars.AI_PIPELINE_MAX_QUIZ_RETRIES || '2' }}
            AI_EMBEDDING_MODEL=${{ vars.AI_EMBEDDING_MODEL || 'text-embedding-3-large' }}
            AI_FACT_EXTRACTOR_MODEL=${{ vars.AI_FACT_EXTRACTOR_MODEL || 'gemini-2.5-flash-lite' }}
            AI_ARTICLE_CLASSIFIER_MODEL=${{ vars.AI_ARTICLE_CLASSIFIER_MODEL || 'gpt-4o-mini' }}
            AI_QUIZ_GENERATOR_MODEL=${{ vars.AI_QUIZ_GENERATOR_MODEL || 'o3-mini' }}
            AI_QUIZ_CRITIC_MODEL=${{ vars.AI_QUIZ_CRITIC_MODEL || 'gpt-4o-mini' }}

            CRAWLER_ENABLED=${{ vars.CRAWLER_ENABLED || 'true' }}
            CRAWLER_BOOTSTRAP_ENABLED=${{ vars.CRAWLER_BOOTSTRAP_ENABLED || 'false' }}
            CRAWLER_MINIMUM_ARTICLES=${{ vars.CRAWLER_MINIMUM_ARTICLES || '30' }}
            CRAWLER_MAX_ITEMS=${{ vars.CRAWLER_MAX_ITEMS || '30' }}
            NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
            NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
            NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}
            BOK_CRAWLER_LIST_URL=${{ vars.BOK_CRAWLER_LIST_URL || 'https://www.bok.or.kr/portal/singl/newsData/listCont.do?pageIndex=1&targetDepth=3&menuNo=201263&syncMenuChekKey=1&searchCnd=1&searchKwd=' }}
            MOEF_CRAWLER_LIST_URL=${{ vars.MOEF_CRAWLER_LIST_URL || 'https://www.moef.go.kr/nw/nes/nesdta.do?menuNo=4010100' }}

            RAG_VECTOR_SEARCH_ENABLED=${{ vars.RAG_VECTOR_SEARCH_ENABLED || 'true' }}
            RAG_VECTOR_SEARCH_MODE=${{ vars.RAG_VECTOR_SEARCH_MODE || 'local' }}
            RAG_VECTOR_SEARCH_INDEX_NAME=${{ vars.RAG_VECTOR_SEARCH_INDEX_NAME || 'article_embedding_index' }}
            RAG_VECTOR_SEARCH_NUM_CANDIDATES=${{ vars.RAG_VECTOR_SEARCH_NUM_CANDIDATES || '200' }}
            RAG_VECTOR_SEARCH_DIMENSIONS=${{ vars.RAG_VECTOR_SEARCH_DIMENSIONS || '3072' }}
            RAG_EMBEDDING_BACKFILL_ENABLED=${{ vars.RAG_EMBEDDING_BACKFILL_ENABLED || 'false' }}
            EOF
            sed -i 's/^[[:space:]]\{12\}//' .env
            chmod 600 .env
            docker compose build app
            docker compose up -d mysql mongodb redis app nginx
            # EBS 8GB 여유 공간 확보 — 미사용 이미지 즉시 정리
            docker image prune -f
