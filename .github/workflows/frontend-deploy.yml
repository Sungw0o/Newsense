name: Frontend CI / CD

# ─────────────────────────────────────────────────────────────────────────────
# 트리거 규칙
#   · frontend/** 변경이 있는 모든 push  → CI (설치 + 테스트)
#   · develop / main push                → CI 완료 후 S3 배포 + CloudFront 캐시 무효화
#   · develop / main 으로 향하는 PR      → CI 만 (배포 없음)
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'frontend/**'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # CI — 모든 브랜치에서 실행
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    name: Install & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # vitest run — watch 모드 없이 단일 실행 (CI 환경 적합)
      - name: Run tests
        run: npm run test:run

  # ────────────────────────────────────────────────────────────────────────────
  # CD — develop / main push 시에만 실행
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy to S3 / CloudFront
    needs: ci
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # VITE_API_BASE_URL 환경 변수 주입 후 프로덕션 빌드
      - name: Vite Production Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.new5ense.site/api/v1' }}
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── S3 동기화 (캐시 전략 분리) ────────────────────────────────────────
      # index.html 등 진입점: 항상 최신을 가져오도록 no-cache
      - name: Sync HTML / root files to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache, no-store, must-revalidate"

      # assets/: Vite가 파일명에 content-hash를 포함하므로 장기 캐시 적용
      - name: Sync hashed assets to S3
        run: |
          aws s3 sync dist/assets/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}/assets/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # CloudFront 엣지 캐시 전체 무효화
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
